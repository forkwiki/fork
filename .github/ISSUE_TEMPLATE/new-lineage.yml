name: Suggest a lineage
description: Propose a meme, character, token or format and what it forked into.
title: "Lineage: "
labels: ["data", "lineage"]
body:
  - type: input
    id: origin
    attributes:
      label: Origin
      description: The earliest object you can document, with its first-seen date and platform.
      placeholder: "Kabosu photo — blog post, 2010"
    validations:
      required: true
  - type: textarea
    id: forks
    attributes:
      label: Forks
      description: One per line — name, type, platform, date, parent.
      placeholder: |
        Doge — MEME — Tumblr — Jul 2013 — parent: Kabosu photo
        Dogecoin — TOKEN — Onchain — Dec 2013 — parent: Doge
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Sources
      description: Public links that support each date and each parent → child link.
    validations:
      required: true
  - type: checkboxes
    id: rules
    attributes:
      label: Checklist
      options:
        - label: Every date and relationship has a public source.
          required: true
        - label: No follower counts, view counts or prices are included.
          required: true
